<!DOCTYPE html>
<html>
<head>
    <title>Dazzling Web Design</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Internal CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 50px;
            text-shadow: 2px 2px 10px #000;
        }

        .highlight {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 style="color: #ffd700;">✨ The Beauty of CSS Styling ✨</h1>

        <div class="highlight">
            <p style="font-size:18px;">
                Web design is more than just structure — it is the art of blending creativity and technology to create stunning digital experiences.
            </p>
        </div>

        <div class="external-style">
            <p>
                Cascading Style Sheets allow developers to transform simple HTML into visually engaging masterpieces that captivate users instantly.
            </p>
        </div>

        <button style="background-color:#ff9800; border:none; padding:15px 25px; font-size:18px; border-radius:25px; cursor:pointer;">
            Explore More
        </button>

    </div>

</body>
</html>
